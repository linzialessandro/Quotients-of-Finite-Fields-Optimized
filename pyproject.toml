[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotient-hyperfields"
version = "0.1.0"
description = "Research library for Krasner quotient hyperfields of finite fields F_q / G_d"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alessandro" }]
keywords = ["hyperfield", "finite fields", "Krasner", "isomorphism"]
dependencies = [
    "galois>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quotient-hyperfields = "quotient_hyperfields.cli:main"
qh-open-questions = "quotient_hyperfields.experiments:main"
qh-invariants = "quotient_hyperfields.invariants_experiments:main"

[tool.setuptools.packages.find]
include = ["quotient_hyperfields*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
