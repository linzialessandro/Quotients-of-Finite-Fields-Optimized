[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotient-hyperfields"
version = "0.2.0"
description = "Research library for Krasner quotient hyperfields of finite fields F_q / G_d"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alessandro Linzi", email = "alessandro.linzi.phd@icloud.com" },
]
keywords = [
    "hyperfield",
    "finite fields",
    "Krasner",
    "isomorphism",
    "arXiv:2608.03625",
]
dependencies = [
    "galois>=0.4",
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/linzialessandro/Quotients-of-Finite-Fields-Optimized"
Documentation = "https://github.com/linzialessandro/Quotients-of-Finite-Fields-Optimized#readme"
Repository = "https://github.com/linzialessandro/Quotients-of-Finite-Fields-Optimized"
Issues = "https://github.com/linzialessandro/Quotients-of-Finite-Fields-Optimized/issues"
Paper = "https://arxiv.org/abs/2608.03625"
DOI = "https://doi.org/10.48550/arXiv.2608.03625"
Changelog = "https://github.com/linzialessandro/Quotients-of-Finite-Fields-Optimized/releases"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
quotient-hyperfields = "quotient_hyperfields.cli:main"
qh-open-questions = "quotient_hyperfields.experiments:main"
qh-invariants = "quotient_hyperfields.invariants_experiments:main"
qh-papers = "quotient_hyperfields.papers_experiments:main"
qh-extended = "quotient_hyperfields.extended_experiments:main"

[tool.setuptools.packages.find]
include = ["quotient_hyperfields*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
